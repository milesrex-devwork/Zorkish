name: Zorkish CI

on:
  push:
    branches:
      - master
      - "zorkish/**"
  pull_request:
    branches:
      - master

jobs:
  browser:
    name: Browser app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

